version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - parking-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-eureka-server:
    build: ./ms-eureka-server
    container_name: ms-eureka-server
    ports:
      - "9090:9090"
    networks:
      - parking-network

  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    ports:
      - "9080:9080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka-server:9090/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka-server:
        condition: service_started
    networks:
      - parking-network

  ms-user:
    build: ./ms-user
    container_name: ms-user
    ports:
      - "9081:9081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/users_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka-server:9090/eureka/
